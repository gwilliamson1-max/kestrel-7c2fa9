# Mass Tort Signal Engine configuration

window:
  # Trailing screening window in days (primary screen)
  screen_days: 365
  # Quarters of history for trajectory analysis on flagged pairs
  trajectory_quarters: 6

universe:
  # Top-N products by serious-report volume to screen each run
  faers_top_drugs: 400
  maude_top_devices: 300
  # Reactions/problems per product to evaluate
  events_per_product: 50
  # Extra products always screened regardless of volume rank
  faers_watchlist: []
  maude_watchlist: []

thresholds:
  # Classic screen: PRR >= 2, chi-square >= 4, >= 3 cases
  prr_min: 2.0
  chi2_min: 4.0
  case_min: 3
  # Only pairs at/above these go to enrichment + LLM scoring
  max_flagged_for_enrichment: 120
  # Final memo size
  memo_top_n: 10

# Per-source allocation. EB05/PRR are NOT comparable across FAERS and MAUDE:
# MAUDE device-problem pairs have tiny expected counts (a device's characteristic
# failure mode is inherently concentrated), so nearly every device pair scores an
# enormous ratio and would crowd every drug signal out of a global ranking.
# Signals are therefore ranked WITHIN each source and allocated fixed slots.
# Drugs get the larger share: they are usually the stronger mass-tort target and
# MAUDE disproportionality is structurally noisier.
source_mix:
  memo_faers: 7        # drug slots in the memo
  memo_maude: 3        # device slots in the memo
  enrich_faers: 70     # per-source caps for trajectory + enrichment + scoring
  enrich_maude: 50

# Device known-complication screen (MAUDE) — src/device_screen.py.
# The drug indication screen (confounding.py) reads /drug/label.json and does
# nothing for devices, which let "atherectomy catheter / embolism" through.
#   Tier 1 mechanism_events    -> DROP: the event is what the device does.
#   Tier 2 known_complications -> DOWNWEIGHT + flag: disclosed procedural
#     complication (weak failure-to-warn, still live as design-defect if a
#     specific model shows an excess rate versus peers).
# Built-in maps live in src/device_screen.py; anything added here is merged in.
# Deliberately conservative — real device torts (metal-on-metal hip ion release,
# mesh erosion, IVC filter fracture) are intentionally NOT listed.
device_screen:
  enabled: true
  known_complication_penalty: 0.35
  demote_to_monitor_below: 60
  mechanism_events: {}      # e.g.  "laser, surgical": [thermal burn]
  known_complications: {}   # e.g.  "prosthesis, shoulder": [loosening]

# Empirical-Bayes + Bayesian disproportionality (src/ebgm.py, src/stats.py).
# EB05 is the 5th percentile of the MGPS/DuMouchel posterior — the FDA-standard
# reliability-adjusted signal score. Unlike PRR, it cannot be inflated by a single
# lucky small count, so it kills tiny-denominator false positives at the source.
# With eb05_gate on, a pair must clear the classic PRR/chi2 screen AND EB05 >= 2.
# Also computed per pair (shown, not gated unless ic025_min is set): BCPNN IC/IC025,
# ROR 95% CI lower bound (ror025), expected count, and RRR (observed/expected).
bayesian:
  eb05_gate: true
  eb05_min: 2.0        # DuMouchel's recommended EBGM signal threshold
  ic025_min: null      # optional extra gate on BCPNN IC025 (>=0 is WHO threshold); null = off

# False-positive screen: indication confounding + implausible statistics.
# Implemented in src/confounding.py; applied in run_pipeline.
#   - Indication confounding: the "adverse event" is the disease the drug is
#     prescribed to treat, or a manifestation of it (e.g. faricimab / retinal
#     thickening, insulin / hyperglycemia). These are lack-of-efficacy, not
#     injuries, and make hopeless failure-to-warn cases -> DROPPED.
#   - Implausible statistics: PRR / chi-square far beyond any real signal (the
#     arithmetic signature of a near-zero background), or a spike-then-collapse
#     quarterly PRR trend -> dropped from the memo and written to
#     docs/filtered.json for review.
# The generic reaction_stoplist below only catches non-specific terms; the
# indication screen catches drug-SPECIFIC clinical terms that look like injuries.
confounding:
  enabled: true
  prr_ceiling: 1000            # PRR above this is a near-zero-background artifact
  chi2_ceiling: 100000         # chi-square above this is a degenerate 2x2 table
  quarter_instability_ratio: 50  # adjacent-quarter PRR swing that flags noise
  # Optional manual indication map for drugs whose openFDA label text is thin.
  # drug-name substring (case-insensitive) -> event terms to treat as the
  # indication. The concept model in confounding.py already covers the common
  # cases; use this only to add drugs/terms it misses.
  indication_overrides:
    faricimab: [retinal thickening, macular edema, macular oedema, retinal edema]

# Generic-availability screen: downweight (not drop). Drugs with generic
# equivalents on the market carry heavy failure-to-warn preemption risk
# (PLIVA v. Mensing 2011; Mutual v. Bartlett 2013 — generic makers can't change
# their label, so state failure-to-warn claims against them are preempted).
# Kept and flagged rather than dropped, because the branded manufacturer's
# exposure window and innovator-liability jurisdictions can still support a case.
# Detection: openFDA NDC directory — an ANDA or authorized-generic listing under
# the drug's generic name means a generic is on the market. Biologics (BLA) have
# biosimilars, not generics, and are not downweighted.
generic_filter:
  enabled: true
  penalty: 0.5                  # multiply LLM viability by this when generic-available
  demote_to_monitor_below: 60   # pursue -> monitor if adjusted viability drops below this
  # Force-classify specific drugs (substring, case-insensitive) -> true/false.
  # Use only to correct openFDA misses; detection is automatic otherwise.
  overrides: {}

# Device federal-preemption screen (MAUDE): downweight (not drop). A device that
# reached market via PMA (Class III) carries Riegel v. Medtronic express
# preemption of state design-defect and failure-to-warn claims — a near-
# dispositive bar. 510(k) devices (Lohr) are NOT preempted, which is why the big
# device MDLs (metal-on-metal hips, surgical mesh, IVC filters) are 510(k) and PMA
# devices (TAVR, drug-eluting stents, artificial discs, most IOLs) rarely sustain
# mass tort. Kept and flagged rather than dropped, because parallel claims
# (manufacturing defect / violation of the device's own FDA-approved specs /
# failure to report to FDA) survive preemption. Detection via openFDA: device
# product code + class from MAUDE records, cross-checked against the PMA registry.
preemption_filter:
  enabled: true
  penalty: 0.3                  # multiply LLM viability by this for PMA/Class-III devices
  demote_to_monitor_below: 60   # pursue -> monitor if adjusted viability drops below this
  # Force-classify specific device generic names (substring) -> true/false preempted.
  overrides: {}

# Reactions too common/nonspecific to ever be litigation signals.
# Filtered before stats to save API calls; LLM would reject them anyway.
reaction_stoplist:
  - DRUG INEFFECTIVE
  - OFF LABEL USE
  - PRODUCT USE IN UNAPPROVED INDICATION
  - DRUG INTERACTION
  - NAUSEA
  - HEADACHE
  - DIZZINESS
  - FATIGUE
  - VOMITING
  - DIARRHOEA
  - RASH
  - PRURITUS
  - MALAISE
  - PAIN
  - PYREXIA
  - CONDITION AGGRAVATED
  - NO ADVERSE EVENT
  - PRODUCT DOSE OMISSION ISSUE
  - INAPPROPRIATE SCHEDULE OF PRODUCT ADMINISTRATION
  - THERAPEUTIC RESPONSE DECREASED
  - WRONG TECHNIQUE IN PRODUCT USAGE PROCESS
  - INTENTIONAL PRODUCT MISUSE
  - ACCIDENTAL OVERDOSE
  - TOXICITY TO VARIOUS AGENTS
  - COMPLETED SUICIDE
  - INTENTIONAL OVERDOSE
  - DEATH        # bare "death" with no mechanism; specific fatal events still pass
  # MAUDE nonspecific patient-problem codes
  - NO CLINICAL SIGNS, SYMPTOMS OR CONDITIONS
  - NO KNOWN IMPACT OR CONSEQUENCE TO PATIENT
  - NO CONSEQUENCES OR IMPACT TO PATIENT
  - NO INFORMATION
  - INSUFFICIENT INFORMATION
  - APPROPRIATE TERM/CODE NOT AVAILABLE
  - PATIENT PROBLEM/MEDICAL PROBLEM

llm:
  model: claude-sonnet-4-5
  max_signals_per_call: 8

enrichment:
  pubmed_max_titles: 5
  courtlistener_max_hits: 10
